[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpu-server"
version = "0.2.2"
description = "MCP server for GPU monitoring: utilization, VRAM, temperature via nvidia-smi / NVML"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "gpu", "nvidia", "cuda", "vram", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp>=2.3,<3",
    "nvidia-ml-py>=12.0.0",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
gpu-server = "mcp_gpu_server.server:main"
mcp-gpu-server = "mcp_gpu_server.server:main"

[project.urls]
Homepage = "https://github.com/moezdil/mcp-gpu-server"
Repository = "https://github.com/moezdil/mcp-gpu-server"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gpu_server"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]
